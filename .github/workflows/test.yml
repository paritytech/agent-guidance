name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          /bin/bash --version | head -n 1
          bash --version | head -n 1
          git --version
          python3 --version
          cargo --version
      - name: Format
        run: cargo fmt --manifest-path tools/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path tools/Cargo.toml

  shellcheck:
    # shellcheck is preinstalled on the Ubuntu runner image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck tools/templates/.agent-guidance-loader/load.sh
